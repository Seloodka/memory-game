<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">
  <title>Memory game</title>
</head>

<body>
  <div class="page">
    <header class="page-header">
      <div class="header-buttons-container">
        <button class="header-button">New game</button>
        <button class="header-button">Leaderboard</button>
      </div>
    </header>
    <section class="game-wrapper">
      <header class="game-header">
        <h1 class="game-title">Memory game</h1>
      </header>
      <div class="game-field">
        <div class="game-card">
          <div class="card-side card-side_front">

          </div>
          <div class="card-side card-side_back"></div>
        </div>

        <div class="game-card game-card_open">
          <div class="card-side card-side_front">

          </div>
          <div class="card-side card-side_back"></div>
        </div>
      </div>
      <footer class="game-footer">
        <span>Turns: 0</span>
        <span>Pairs found: 0/8</span>
      </footer>
    </section>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>

</html>
